bing:
  search:
    subscription:
      key: ${BING_SEARCH_SUBSCRIPTION_KEY:}
petstore:
  service:
    pet:
     url: ${PETSTOREPETSERVICE_URL:http://localhost:8081}
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    order:
      url: ${PETSTOREORDERSERVICE_URL:http://localhost:8083}
  logging:
    additional-headers-to-log: ${PETSTORE_ADDITIONAL_HEADERS_TO_LOG:}
    additional-headers-to-send: ${PETSTORE_ADDITIONAL_HEADERS_TO_SEND:}
  signalR:
    negotiation-url: ${SIGNALR_NEGOTIATION_URL:}
    service-url: ${SIGNALR_SERVICE_URL:}
    key: ${SIGNALR_SERVICE_KEY:}
    update:
      fixedRate: ${SIGNALR_UPDATE_FIXEDRATE:60000}
server:
  port: ${PETSTOREAPP_SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: "*"       
  trace:
    http:
      enabled: true 
  endpoint:
    httptrace:
      enabled: true
spring:
  application:
    name: petstoreapp
  thymeleaf:
    cache: false
  cache:
    cache-names: currentUsers
  cloud:
    azure:
      keyvault:
        secret:
          property-source-enabled: true
          property-sources[0]:
            endpoint: https://petstoredemo-vault.vault.azure.net
      active-directory:
        b2c:
          enabled: true
          tenant: ${petstoreAppB2CTenant}
          base-uri: "https://${spring.cloud.azure.active-directory.b2c.tenant}.b2clogin.com/${spring.cloud.azure.active-directory.b2c.tenant}.onmicrosoft.com/"
          credential:
            client-id: ${petstoreAppB2CClientId}
            client-secret: '${petstoreAppB2CClientSecret}'
          logout-success-url: ${PETSTOREAPP_B2C_LOGOUT_URL:}
          user-flows:
            sign-up-or-sign-in: B2C_1_signupsignin
            profile-edit: B2C_1_profileediting
            password-reset: B2C_1_passwordreset
          user-name-attribute-name: given_name
      servicebus:
        namespace: petstoreservicebus
        entity-name: orders
        entity-type: queue
        connection-string: ${serviceBusConnectionString}
